<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog dos Videogames</title>
    
</head>

<body>
    <header>
        <h1>Tudo Sobre Videogames</h1>
        <p>Todas curiosidades e fatos sobre jogos eletrônicos!</p>
        <style>
       
        body {
            font-family: Arial, sans-serif; 
            margin: 0;
            background-color: #f4f4f9;
        }

        header {
            background-color: #4169E1;
            color: #FFFFFF;
            text-align: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            border-radius: 0 0 10px 10px;
        }
            
        main {
            background-color: #FFFFFF;
            color: #183C63;
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            gap: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }
            
        .artigo-autor {
            font-weight: bold;
            color: #555;
        }
    </style>
    </header>

    <main>
        <img src="videojogos.png"
            alt="Explicação resumida sobre a Imagem escolhida, para as pessoas com dificuldades visuais.">
        <div>
            <h2>Primeiro post</h2>
            <p class="artigo-autor">Por: Victor Augusto</p>
            <p>Bem vindos! Aqui você descobre tudo sobre a história dos videogames.</p>
            <button>👌<span>0</span></button>
            <button>👍 <span>0</span></button>
        </div>
    </main>

</body>
<script>
    const botoes = document.querySelectorAll("button");
    botoes.forEach(function (botao) {
        botao.addEventListener("click", botaoClicado);

        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;
        }
    });
</script>

</html>
